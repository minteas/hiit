<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIITAI - HIITワークアウトジェネレーター</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface2: #1a1a1a;
      --accent: #e8ff00; --accent2: #ff4d00;
      --text: #f0f0f0; --muted: #666; --border: #2a2a2a;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; }
    .app { min-height: 100vh; background: var(--bg); padding: 20px; max-width: 480px; margin: 0 auto; padding-bottom: 80px; }
    .header { text-align: center; padding: 32px 0 24px; border-bottom: 1px solid var(--border); margin-bottom: 28px; position: relative; }
    .header::after { content: ''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 60px; height: 2px; background: var(--accent); }
    .header h1 { font-family: 'Bebas Neue', cursive; font-size: 3rem; letter-spacing: 6px; color: var(--text); line-height: 1; }
    .header h1 span { color: var(--accent2); }
    .header p { font-size: 0.7rem; color: var(--muted); margin-top: 6px; letter-spacing: 2px; }
    .hiit-badge { display: inline-block; background: var(--accent2); color: #fff; font-family: 'Bebas Neue', cursive; font-size: 0.75rem; letter-spacing: 3px; padding: 3px 10px; margin-top: 8px; }
    .share-banner { background: var(--surface); border: 1px solid var(--border); padding: 14px 16px; margin-bottom: 28px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .share-banner-text { font-size: 0.72rem; color: var(--muted); line-height: 1.5; }
    .share-banner-text strong { color: var(--text); display: block; margin-bottom: 2px; font-size: 0.78rem; }
    .share-btn { flex-shrink: 0; background: var(--accent); border: none; color: #000; font-family: 'Bebas Neue', cursive; font-size: 0.85rem; letter-spacing: 2px; padding: 10px 16px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .share-btn:hover { background: #fff; }
    .form-section { margin-bottom: 20px; }
    .form-label { font-size: 0.65rem; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; display: block; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .input-field { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 14px 16px; font-family: 'Noto Sans JP', sans-serif; font-size: 0.9rem; width: 100%; outline: none; transition: border-color 0.2s; -webkit-appearance: none; appearance: none; }
    .input-field:focus { border-color: var(--accent); }
    .input-field option { background: #111; }
    .age-input { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); padding: 0 16px; }
    .age-input input { background: transparent; border: none; color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 0.9rem; width: 100%; outline: none; padding: 14px 0; }
    .age-input span { color: var(--muted); font-size: 0.8rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 8px 14px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 0.75rem; cursor: pointer; transition: all 0.15s; font-family: 'Noto Sans JP', sans-serif; letter-spacing: 1px; }
    .chip:hover { border-color: var(--accent); color: var(--text); }
    .chip.active { border-color: var(--accent); background: var(--accent); color: #000; font-weight: 700; }
    .generate-btn { width: 100%; padding: 18px; background: var(--accent2); border: none; color: #fff; font-family: 'Bebas Neue', cursive; font-size: 1.4rem; letter-spacing: 4px; cursor: pointer; transition: all 0.2s; margin-top: 28px; }
    .generate-btn:hover:not(:disabled) { background: #ff6a00; transform: translateY(-1px); }
    .generate-btn:disabled { background: var(--surface2); color: var(--muted); cursor: not-allowed; }
    .results { margin-top: 32px; border-top: 1px solid var(--border); padding-top: 28px; display: none; }
    .results-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .results-title { font-family: 'Bebas Neue', cursive; font-size: 1.4rem; letter-spacing: 4px; color: var(--accent); }
    .results-meta { font-size: 0.65rem; color: var(--muted); letter-spacing: 2px; }
    .protocol-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .protocol-chip { font-size: 0.65rem; padding: 4px 10px; border: 1px solid var(--accent2); color: var(--accent2); letter-spacing: 1px; }
    .profile-tag { font-size: 0.65rem; color: var(--muted); letter-spacing: 1px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .profile-tag span { color: #aaa; margin-right: 8px; }
    .exercise-card { background: var(--surface); border: 1px solid var(--border); padding: 18px 20px; margin-bottom: 10px; display: flex; gap: 16px; align-items: flex-start; opacity: 0; transform: translateY(12px); transition: all 0.35s ease; }
    .exercise-card.must { border-color: var(--accent); }
    .exercise-card.visible { opacity: 1; transform: translateY(0); }
    .exercise-num { font-family: 'Bebas Neue', cursive; font-size: 2rem; color: var(--border); line-height: 1; min-width: 36px; }
    .exercise-body { flex: 1; }
    .exercise-name { font-weight: 700; font-size: 1rem; margin-bottom: 5px; }
    .exercise-timing { font-family: 'Bebas Neue', cursive; font-size: 1.1rem; letter-spacing: 2px; color: var(--accent2); margin-bottom: 5px; }
    .exercise-tags { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .tag { font-size: 0.6rem; padding: 2px 8px; border: 1px solid var(--border); color: var(--muted); letter-spacing: 1px; }
    .tag.intensity-high { border-color: var(--accent2); color: var(--accent2); }
    .tag.intensity-mid { border-color: #ffaa00; color: #ffaa00; }
    .tag.must-tag { border-color: var(--accent); color: var(--accent); }
    .exercise-tip { font-size: 0.75rem; color: var(--muted); line-height: 1.6; }
    .advice-box { background: var(--surface2); border-left: 3px solid var(--accent2); padding: 16px 20px; margin-top: 20px; font-size: 0.8rem; color: #ccc; line-height: 1.8; }
    .advice-label { font-size: 0.6rem; letter-spacing: 3px; color: var(--accent2); margin-bottom: 8px; }
    .total-time { background: var(--surface); border: 1px solid var(--accent); padding: 14px 20px; margin-top: 16px; display: flex; justify-content: space-between; align-items: center; }
    .total-time-label { font-size: 0.65rem; letter-spacing: 3px; color: var(--muted); }
    .total-time-value { font-family: 'Bebas Neue', cursive; font-size: 1.5rem; color: var(--accent); letter-spacing: 2px; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .regenerate-btn { padding: 14px; background: transparent; border: 1px solid var(--accent); color: var(--accent); font-family: 'Bebas Neue', cursive; font-size: 1rem; letter-spacing: 3px; cursor: pointer; transition: all 0.2s; }
    .regenerate-btn:hover { background: var(--accent); color: #000; }
    .result-share-btn { padding: 14px; background: transparent; border: 1px solid var(--muted); color: var(--muted); font-family: 'Bebas Neue', sans-serif; font-size: 0.85rem; letter-spacing: 1px; cursor: pointer; transition: all 0.2s; }
    .result-share-btn:hover { border-color: var(--text); color: var(--text); }
    .result-share-btn.copied { border-color: #00e676; color: #00e676; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #00e676; color: #000; font-family: 'Bebas Neue', cursive; font-size: 1rem; letter-spacing: 3px; padding: 12px 28px; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 999; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>HIIT<span>AI</span></h1>
    <div class="hiit-badge">HIGH INTENSITY INTERVAL TRAINING</div>
    <p style="margin-top:10px">AI POWERED WORKOUT GENERATOR</p>
  </div>

  <div class="share-banner">
    <div class="share-banner-text">
      <strong>🔗 友達と共有しよう</strong>
      このページのURLをコピーして送るだけ。誰でも無料で使えます。
    </div>
    <button class="share-btn" onclick="copyUrl()">URL<br>コピー</button>
  </div>

  <div class="form-section">
    <div class="row-2">
      <div>
        <label class="form-label">年齢</label>
        <div class="age-input">
          <input type="number" id="age" min="10" max="90" placeholder="25">
          <span>歳</span>
        </div>
      </div>
      <div>
        <label class="form-label">性別</label>
        <select class="input-field" id="gender">
          <option value="">選択</option>
          <option value="男性">男性</option>
          <option value="女性">女性</option>
          <option value="その他">その他</option>
        </select>
      </div>
    </div>
  </div>

  <div class="form-section">
    <label class="form-label">鍛えたい部位（複数可）</label>
    <div class="chips" id="body-parts">
      <button class="chip" data-value="胸" onclick="toggleChip(this,'body')">胸</button>
      <button class="chip" data-value="背中" onclick="toggleChip(this,'body')">背中</button>
      <button class="chip" data-value="肩" onclick="toggleChip(this,'body')">肩</button>
      <button class="chip" data-value="腕" onclick="toggleChip(this,'body')">腕</button>
      <button class="chip" data-value="腹筋" onclick="toggleChip(this,'body')">腹筋</button>
      <button class="chip" data-value="脚" onclick="toggleChip(this,'body')">脚</button>
      <button class="chip" data-value="お尻" onclick="toggleChip(this,'body')">お尻</button>
      <button class="chip" data-value="全身" onclick="toggleChip(this,'body')">全身</button>
    </div>
  </div>

  <div class="form-section">
    <label class="form-label">体力レベル</label>
    <div class="chips" id="level-chips">
      <button class="chip" data-value="初心者" onclick="toggleChip(this,'level')">初心者</button>
      <button class="chip" data-value="中級者" onclick="toggleChip(this,'level')">中級者</button>
      <button class="chip" data-value="上級者" onclick="toggleChip(this,'level')">上級者</button>
    </div>
  </div>

  <div class="form-section">
    <label class="form-label">トレーニング目標</label>
    <div class="chips" id="goal-chips">
      <button class="chip" data-value="ダイエット" onclick="toggleChip(this,'goal')">ダイエット</button>
      <button class="chip" data-value="体力向上" onclick="toggleChip(this,'goal')">体力向上</button>
      <button class="chip" data-value="姿勢改善" onclick="toggleChip(this,'goal')">姿勢改善</button>
      <button class="chip" data-value="スポーツパフォーマンス" onclick="toggleChip(this,'goal')">スポーツパフォーマンス</button>
      <button class="chip" data-value="筋力維持" onclick="toggleChip(this,'goal')">筋力維持</button>
    </div>
  </div>

<button class="generate-btn" id="gen-btn" onclick="generate()" disabled>GENERATE HIIT MENU</button>

  <div class="results" id="results">
    <div class="results-header">
      <div class="results-title">TODAY'S HIIT</div>
      <div class="results-meta">5 EXERCISES</div>
    </div>
    <div class="protocol-row" id="protocol-row"></div>
    <div class="profile-tag" id="profile-tag"></div>
    <div id="exercise-list"></div>
    <div class="total-time">
      <span class="total-time-label">TOTAL WORKOUT TIME</span>
      <span class="total-time-value" id="total-time-val"></span>
    </div>
    <div class="advice-box">
      <div class="advice-label">TRAINER'S ADVICE</div>
      <div id="advice-text"></div>
    </div>
    <div class="btn-row">
      <button class="regenerate-btn" onclick="generate()">↺ REGENERATE</button>
      <button class="result-share-btn" id="copy-menu-btn" onclick="copyMenu()">📋 メニューをコピー</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== 100種目 HIIT データベース =====
// must:true はサイドベント（必ず選出）
const HIIT_DB = [
  // ── 全身・有酸素 ──
  { name:"バーピー", parts:["全身"], tags:["全身","有酸素"], intensity:"high", tip:"立つ→しゃがむ→プッシュアップ→ジャンプの流れをリズムよく。着地は膝を曲げてソフトに。" },
  { name:"ジャンピングジャック", parts:["全身"], tags:["全身","有酸素"], intensity:"mid", tip:"腕を頭上で合わせながら足を開閉。リズムを一定に保つ。" },
  { name:"マウンテンクライマー", parts:["全身","腹筋"], tags:["全身","体幹"], intensity:"high", tip:"プランクから膝を交互に胸へ引き込む。腰が浮かないよう体幹を固める。" },
  { name:"ハイニーラン", parts:["全身","脚"], tags:["全身","有酸素"], intensity:"high", tip:"膝を腰の高さまで引き上げながら高速で駆け足。腕も大きく振る。" },
  { name:"スケーター", parts:["全身","脚","お尻"], tags:["全身","横方向"], intensity:"high", tip:"横にジャンプして片脚着地。重心を低く保ってサイドに跳ぶ。" },
  { name:"バーピーショルダープレス", parts:["全身","肩"], tags:["全身","爆発系"], intensity:"high", tip:"バーピーから立ち上がった勢いでそのままオーバーヘッドプレス。全身を連動させる。" },
  { name:"タックジャンプ", parts:["全身","腹筋","脚"], tags:["爆発系","腹筋"], intensity:"high", tip:"ジャンプして膝を胸に引きつける。腸腰筋と腹筋を爆発的に使う。" },
  { name:"ジャンプスクワット", parts:["全身","脚","お尻"], tags:["爆発系","脚"], intensity:"high", tip:"スクワットから爆発的に跳び上がる。着地はつま先から入り膝を曲げて吸収。" },
  { name:"スプリントその場", parts:["全身"], tags:["全身","有酸素"], intensity:"high", tip:"その場で全力ダッシュ。腕を大きく振り、かかとをお尻に引きつける。" },
  { name:"ラテラルジャンプ", parts:["全身","脚"], tags:["全身","横方向"], intensity:"high", tip:"左右に素早くジャンプ。着地の瞬間に膝を曲げて衝撃を吸収する。" },

  // ── 胸 ──
  { name:"プライオプッシュアップ", parts:["胸","腕"], tags:["胸","爆発系"], intensity:"high", tip:"押し上げ時に手が床から離れるよう爆発的に押す。胸と三頭筋に高い負荷。" },
  { name:"ワイドプッシュアップ", parts:["胸"], tags:["胸","自重"], intensity:"mid", tip:"手幅を広めにとり、胸の外側を中心に鍛える。体は一直線をキープ。" },
  { name:"ダイヤモンドプッシュアップ", parts:["胸","腕"], tags:["胸内側","三頭筋"], intensity:"mid", tip:"両手で菱形を作り胸の真下に置く。胸の内側と三頭筋が強く刺激される。" },
  { name:"インクラインプッシュアップ", parts:["胸"], tags:["胸上部","自重"], intensity:"mid", tip:"台に手をつき上体を斜めにしてプッシュアップ。胸上部をターゲットに。" },
  { name:"デクラインプッシュアップ", parts:["胸"], tags:["胸下部","自重"], intensity:"mid", tip:"足を台に乗せて行うプッシュアップ。胸の下部に強い刺激。" },
  { name:"アーチャープッシュアップ", parts:["胸","腕"], tags:["胸","上級"], intensity:"high", tip:"片腕を伸ばしながら反対の腕で体を下ろす。片腕プッシュアップへの移行種目。" },
  { name:"クラッププッシュアップ", parts:["胸","腕"], tags:["胸","爆発系"], intensity:"high", tip:"プッシュアップの頂点で手を叩く。爆発的な胸筋と三頭筋の訓練。" },
  { name:"スパイダーマンプッシュアップ", parts:["胸","腹筋"], tags:["胸","体幹"], intensity:"high", tip:"プッシュアップ時に膝を肘に引きつける。胸と体幹を同時に鍛える。" },

  // ── 背中 ──
  { name:"スーパーマン", parts:["背中"], tags:["背中","体幹"], intensity:"mid", tip:"うつ伏せで両手両足を同時に浮かせる。脊柱起立筋と臀筋を収縮させる。" },
  { name:"リバースバードドッグ", parts:["背中","腹筋"], tags:["背中","体幹"], intensity:"mid", tip:"四つ這いで対角の手と足を伸ばす。体幹の安定と背面筋群の連動を鍛える。" },
  { name:"ベントオーバーロウ（バンド）", parts:["背中"], tags:["背中","複合"], intensity:"mid", tip:"バンドを使い上体を倒して素早く引く。リズム重視で心拍も上げる。" },
  { name:"スーパーマンパルス", parts:["背中"], tags:["背中","等尺性"], intensity:"mid", tip:"スーパーマン姿勢で小刻みに上下パルス。脊柱起立筋を持続的に鍛える。" },
  { name:"リバースハイパー", parts:["背中","お尻"], tags:["背中","臀筋"], intensity:"mid", tip:"うつ伏せで脚だけを後方に浮かせる。下背部と臀筋のコンビネーション。" },
  { name:"プローンコブラ", parts:["背中"], tags:["背中","姿勢"], intensity:"mid", tip:"うつ伏せで上体を反らせながら腕を後方へ回す。姿勢改善に効果的。" },
  { name:"ラットプルダウンジャンプ（バンド）", parts:["背中"], tags:["背中","爆発系"], intensity:"high", tip:"バンドを使い広背筋の動きをジャンプと組み合わせる。" },

  // ── 肩 ──
  { name:"パイクプッシュアップ", parts:["肩"], tags:["肩","自重"], intensity:"mid", tip:"腰を高く上げた逆V字姿勢でプッシュアップ。三角筋前部に強い刺激。" },
  { name:"アーノルドプレス（速め）", parts:["肩"], tags:["肩","複合"], intensity:"mid", tip:"手のひらを回しながら頭上に押す動作をリズムよく繰り返す。" },
  { name:"プランクショルダータップ", parts:["肩","腹筋"], tags:["肩","体幹"], intensity:"mid", tip:"プランク姿勢で交互に肩を叩く。体の揺れを最小限に抑える。" },
  { name:"ショルダープレスジャンプ", parts:["肩","全身"], tags:["肩","爆発系"], intensity:"high", tip:"スクワットジャンプとショルダープレスを組み合わせた全身種目。" },
  { name:"フロントレイズパルス", parts:["肩"], tags:["肩","等尺性"], intensity:"mid", tip:"腕を肩の高さで保ちながら小刻みに上下。三角筋前部をバーンさせる。" },
  { name:"サイドレイズ（速め）", parts:["肩"], tags:["肩","単関節"], intensity:"mid", tip:"腕を肩の高さまで素早く上げ下げ。三角筋中部に集中して刺激を与える。" },
  { name:"ウォールウォーク", parts:["肩","全身"], tags:["肩","上級"], intensity:"high", tip:"プランクから壁を使って逆立ち方向へ歩く。肩と体幹の高強度種目。" },

  // ── 腕 ──
  { name:"クロスボディマウンテンクライマー", parts:["腕","腹筋"], tags:["腕","体幹"], intensity:"high", tip:"膝を対角の肘に向けて引き込む。上腕と体幹に効く高強度バリエーション。" },
  { name:"チェアディップス", parts:["腕"], tags:["三頭筋","自重"], intensity:"mid", tip:"椅子や台に手をつき肘を曲げ伸ばしする。リズムよくハイレップで行う。" },
  { name:"コマンドープッシュアップ", parts:["腕","胸"], tags:["腕","体幹"], intensity:"high", tip:"プッシュアップ後に肘→手の順で体を上げ下げ。上腕全体と体幹を連動。" },
  { name:"フレンチプレス", parts:["腕"], tags:["二の腕","三頭筋"], intensity:"mid", tip:"頭上にダンベルやバンドを持ち、肘を固定して後頭部へ下ろす。三頭筋長頭に効く。" },
  { name:"ナローグリッププッシュアップ", parts:["腕","胸"], tags:["三頭筋","自重"], intensity:"mid", tip:"手幅を肩幅より狭くすることで三頭筋を強く刺激できる。" },
  { name:"トライセプスキックバック（バンド）", parts:["腕"], tags:["三頭筋","単関節"], intensity:"mid", tip:"上体を倒して肘を固定し、前腕だけを後方へ伸ばす。三頭筋をしっかり収縮。" },
  { name:"バーベルカール（速め）", parts:["腕"], tags:["二頭筋","単関節"], intensity:"mid", tip:"肘を固定し上腕二頭筋だけで巻き上げる。反動を使わずリズムよく行う。" },
  { name:"ハンマーカール（速め）", parts:["腕"], tags:["二頭筋","単関節"], intensity:"mid", tip:"親指を上に向けたまま素早くカール。上腕筋と腕橈骨筋を鍛える。" },

  { name:"クォータースクワットパルス", parts:["脚"], tags:["脚","等尺性"], intensity:"mid", tip:"浅いスクワット姿勢で素早いパルス動作。大腿四頭筋表層を集中して鍛える。" },

  { name:"グルートブリッジジャンプ", parts:["お尻"], tags:["お尻","爆発系"], intensity:"high", tip:"ブリッジ姿勢から腰を落とさずお尻を収縮させ素早くリフト。大臀筋を爆発的に使う。" },
  { name:"ドンキーキック（速め）", parts:["お尻"], tags:["お尻","自重"], intensity:"mid", tip:"四つ這いで膝を90度に保ちながら脚を素早く蹴り上げる。大臀筋のバーンを感じて。" },
  { name:"カーテシーランジジャンプ", parts:["お尻","脚"], tags:["お尻","爆発系"], intensity:"high", tip:"後ろ足を対角に引いてランジし跳び上がる。中臀筋と大臀筋に効くHIIT種目。" },
  { name:"スクワットパルス＋ジャンプ", parts:["お尻","脚"], tags:["お尻","爆発系"], intensity:"high", tip:"スクワット姿勢でパルスを数回してからジャンプ。臀筋と大腿筋を限界まで追い込む。" },
  { name:"ヒップスラスト（バンド）", parts:["お尻"], tags:["お尻","複合"], intensity:"mid", tip:"バンドを膝上にかけてヒップスラスト。外転動作も加わり中臀筋も同時に鍛えられる。" },
  { name:"クラブウォーク", parts:["お尻"], tags:["お尻","横歩き"], intensity:"mid", tip:"バンドを膝上に巻いて横に小刻みステップ。中臀筋と大臀筋外側を集中して刺激する。" },
  { name:"ファイアハイドラント", parts:["お尻"], tags:["お尻","外転"], intensity:"mid", tip:"四つ這いで膝を横に開く。中臀筋の外転動作に集中して大臀筋外側を鍛える。" },
  { name:"グルートキックバックジャンプ", parts:["お尻","脚"], tags:["お尻","爆発系"], intensity:"high", tip:"立った状態から片脚を後方に蹴り上げてジャンプ。大臀筋と体幹を連動させる。" },
  { name:"シングルレッグブリッジ", parts:["お尻"], tags:["お尻","片脚"], intensity:"mid", tip:"片脚を伸ばしたままブリッジ。大臀筋と体幹安定筋に高い負荷がかかる。" },
  { name:"パルスランジ（お尻重視）", parts:["お尻","脚"], tags:["お尻","等尺性"], intensity:"mid", tip:"ランジ姿勢でパルス動作。前脚の大臀筋と後ろ脚のハムストリングスを持続刺激。" },

  // ── 体幹ミックス ──
  { name:"プランク", parts:["腹筋","全身"], tags:["体幹","等尺性"], intensity:"mid", tip:"体を一直線に保ちお腹を引き込む。呼吸を止めず体幹を固め続ける。" },
  { name:"サイドプランク", parts:["腹筋"], tags:["体幹","脇腹"], intensity:"mid", tip:"体を横向きにして片腕で支える。脇腹と体幹側面の安定筋を鍛える。" },
  { name:"ベアクロール", parts:["全身","腹筋"], tags:["全身","体幹"], intensity:"high", tip:"四つ這いで膝を浮かせながら前後左右に移動する。全身の連動性を高める。" },
  { name:"インチワーム", parts:["全身","背中"], tags:["全身","可動性"], intensity:"mid", tip:"前屈から手を歩かせてプランク姿勢へ。全身の可動性と体幹を同時に鍛える。" },
  { name:"バードドッグ（速め）", parts:["腹筋","背中"], tags:["体幹","安定"], intensity:"mid", tip:"四つ這いで対角の手足を伸ばしてリズムよく交互に行う。体幹の安定性向上。" },
  { name:"プランクアップダウン", parts:["腹筋","腕"], tags:["体幹","複合"], intensity:"high", tip:"プランクから肘立てプランクへ交互に移行。体幹と上腕三頭筋を同時に追い込む。" },
  { name:"クロコダイルウォーク", parts:["全身","腹筋"], tags:["全身","体幹"], intensity:"high", tip:"腕立て姿勢で腕と脚を同時に前進。全身の連動と体幹強化に効果的。" },
  { name:"リバースプランク", parts:["背中","お尻"], tags:["体幹","背面"], intensity:"mid", tip:"仰向けで体を一直線に保つ。背面の体幹筋と臀筋を持続的に鍛える。" },
];

const TIMING = {
  初心者: { work:"30秒", rest:"30秒", rounds:"3ラウンド", totalMin:18 },
  中級者: { work:"40秒", rest:"20秒", rounds:"4ラウンド", totalMin:22 },
  上級者: { work:"45秒", rest:"15秒", rounds:"5ラウンド", totalMin:25 },
};

let selectedBody = [];
let selectedLevel = "";
let selectedGoal = "";
let lastResult = null;

function toggleChip(btn, type) {
  if (type === 'level') {
    document.querySelectorAll('#level-chips .chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedLevel = btn.dataset.value;
  } else if (type === 'goal') {
    document.querySelectorAll('#goal-chips .chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedGoal = btn.dataset.value;
  } else {
    btn.classList.toggle('active');
    const v = btn.dataset.value;
    if (selectedBody.includes(v)) selectedBody = selectedBody.filter(x => x !== v);
    else selectedBody.push(v);
  }
  checkValid();
}

function checkValid() {
  const age = document.getElementById('age').value;
  const gender = document.getElementById('gender').value;
  const ok = age && gender && selectedBody.length > 0 && selectedLevel && selectedGoal;
  document.getElementById('gen-btn').disabled = !ok;
}

document.getElementById('age').addEventListener('input', checkValid);
document.getElementById('gender').addEventListener('change', checkValid);

function selectExercises(parts, level) {
  const t = TIMING[level];
  const timing = `${t.work} ON / ${t.rest} OFF`;
  const usedNames = new Set();
  const selected = [];

  // ① サイドベントを必ず追加
  const mustEx = HIIT_DB.find(e => e.must);
  selected.push({ ...mustEx, timing });
  usedNames.add(mustEx.name);

  // ② 選択部位にマッチする種目をシャッフルして候補に
  const isAllBody = parts.includes("全身");
  const partPool = HIIT_DB.filter(e =>
    !e.must &&
    (isAllBody || e.parts.some(p => parts.includes(p)))
  ).sort(() => Math.random() - 0.5);

  for (const ex of partPool) {
    if (selected.length >= 5) break;
    if (!usedNames.has(ex.name)) {
      selected.push({ ...ex, timing });
      usedNames.add(ex.name);
    }
  }

  // ③ まだ足りなければ全種目から補填
  if (selected.length < 5) {
    const fallback = HIIT_DB.filter(e => !e.must).sort(() => Math.random() - 0.5);
    for (const ex of fallback) {
      if (selected.length >= 5) break;
      if (!usedNames.has(ex.name)) {
        selected.push({ ...ex, timing });
        usedNames.add(ex.name);
      }
    }
  }

  // サイドベントをランダムな位置に挿入（常に先頭は避ける）
  const must = selected.splice(0, 1)[0];
  const pos = Math.floor(Math.random() * selected.length) + 1;
  selected.splice(pos, 0, must);

  return selected.slice(0, 5);
}

function generateAdvice(age, level, goal) {
  const t = TIMING[level];
  let lines = [];
  lines.push(`${t.work}全力・${t.rest}休憩の${t.rounds}で行いましょう。インターバルタイマーを使うと管理しやすいです。`);
  if (goal==="ダイエット") lines.push("HIITはアフターバーン効果が高く、短時間で高いカロリー消費が期待できます。");
  if (goal==="体力向上") lines.push("最大心拍数の80〜90%を目安に追い込みましょう。心肺機能の向上に効果的です。");
  if (goal==="スポーツパフォーマンス") lines.push("爆発的な動きと素早い切り返しがスポーツパフォーマンス向上に直結します。");
  if (goal==="姿勢改善") lines.push("体幹・背中・お尻を鍛えることで姿勢の土台が整います。フォームを丁寧に意識して。");
  if (parseInt(age)>=40) lines.push("40代以降は十分なウォームアップと関節の可動域確認を必ず行いましょう。");
  if (level==="初心者") lines.push("慣れるまでジャンプ系の動作はステップで代替してOK。フォームの習得を優先して。");
  return lines.slice(0,2).join(" ");
}

function generate() {
  const age = document.getElementById('age').value;
  const gender = document.getElementById('gender').value;
  const t = TIMING[selectedLevel];
  const exercises = selectExercises(selectedBody, selectedLevel);
  const advice = generateAdvice(age, selectedLevel, selectedGoal);
  lastResult = { exercises, advice, timing: t, age, gender };

  document.getElementById('protocol-row').innerHTML =
    `<span class="protocol-chip">⚡ ${t.work} WORK</span>
     <span class="protocol-chip">💤 ${t.rest} REST</span>
     <span class="protocol-chip">🔁 ${t.rounds}</span>`;

  document.getElementById('profile-tag').innerHTML =
    `<span>${age}歳</span><span>${gender}</span>` +
    selectedBody.map(p=>`<span>${p}</span>`).join('') +
    `<span>${selectedLevel}</span><span>${selectedGoal}</span>`;

  const list = document.getElementById('exercise-list');
  list.innerHTML = exercises.map((ex,i) => `
    <div class="exercise-card${ex.must?' must':''}" id="card-${i}">
      <div class="exercise-num">0${i+1}</div>
      <div class="exercise-body">
        <div class="exercise-tags">
          ${ex.must ? '<span class="tag must-tag">★ 必須</span>' : ''}
          ${ex.tags.map(tag=>`<span class="tag ${ex.intensity==='high'?'intensity-high':'intensity-mid'}">${tag}</span>`).join('')}
        </div>
        <div class="exercise-name">${ex.name}</div>
        <div class="exercise-timing">${ex.timing}</div>
        <div class="exercise-tip">${ex.tip}</div>
      </div>
    </div>`).join('');

  document.getElementById('total-time-val').textContent = `約${t.totalMin}分`;
  document.getElementById('advice-text').textContent = advice;

  const results = document.getElementById('results');
  results.style.display = 'block';

  exercises.forEach((_,i) => {
    setTimeout(() => {
      const card = document.getElementById(`card-${i}`);
      if (card) card.classList.add('visible');
    }, i * 100 + 50);
  });

  setTimeout(() => window.scrollTo({ top: 500, behavior:'smooth' }), 200);
}

function copyUrl() {
  navigator.clipboard.writeText(window.location.href)
    .then(() => showToast("URLをコピーしました！"))
    .catch(() => showToast(window.location.href));
}

function copyMenu() {
  if (!lastResult) return;
  const text = [
    "🔥 HIIT WORKOUT MENU",
    `⚡ ${lastResult.timing.work} ON / 💤 ${lastResult.timing.rest} OFF / 🔁 ${lastResult.timing.rounds}`,
    "",
    ...lastResult.exercises.map((ex,i)=>`0${i+1}. ${ex.name}${ex.must?' ★':''}  \n    ${ex.tip}`),
    "",
    `💪 ${lastResult.advice}`,
    "",
    `-- このメニューを使う → ${window.location.href}`,
  ].join("\n");
  navigator.clipboard.writeText(text)
    .then(() => {
      const btn = document.getElementById('copy-menu-btn');
      btn.textContent = "✓ COPIED";
      btn.classList.add('copied');
      showToast("メニューをコピーしました！");
      setTimeout(() => { btn.textContent = "📋 メニューをコピー"; btn.classList.remove('copied'); }, 2000);
    })
    .catch(() => showToast("コピーできませんでした"));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
